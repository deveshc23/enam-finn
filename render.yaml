services:
  # 1. FastAPI Backend Service
  - type: web
    name: finn-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000

  # 2. Next.js Frontend Service
  - type: web
    name: finn-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_INTERNAL_URL
        fromService:
          type: web
          name: finn-backend
          property: host
